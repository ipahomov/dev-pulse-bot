name: RSS Digest

on:
  schedule:
    - cron: "17 8,15 * * *"  # 2x/day: 8:17, 15:17 UTC = 10:17, 17:17 Poland (CEST); 9:17, 16:17 in winter (CET) (off-the-hour to reduce GitHub scheduling delays)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/send_digest.py

      - name: Commit sent.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent.json
          git diff --cached --quiet || git commit -m "chore: update sent.json [skip ci]"
          git push
